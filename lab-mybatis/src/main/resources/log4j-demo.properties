# =====================================================================
# 演示程序专用的日志配置：把 Mapper 包的 SQL 日志关掉，
# 让控制台只留下 Demo 自己的输出，看起来更干净。
# （测试用的 log4j.properties 仍然保留 DEBUG，方便排查 SQL。）
# =====================================================================
log4j.rootLogger=WARN, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.encoding=UTF-8
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%m%n

# 演示时不需要 SQL 明细
log4j.logger.com.lab.mybatis.mapper=WARN
log4j.logger.com.lab.mapper=WARN
log4j.logger.com.lab.plus.mapper=WARN
log4j.logger.org.apache.ibatis=WARN
log4j.logger.com.lab.mybatis.plugin=WARN

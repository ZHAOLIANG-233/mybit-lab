# =====================================================================
# Log4j 1.2.17 配置（与 mybatis-config.xml 的 logImpl=LOG4J 对应）
# 安全说明：1.2.17 已 EOL（CVE-2019-17571 / CVE-2021-4104）。
# 本项目只使用 ConsoleAppender，不涉及 JMSAppender 与反序列化，风险可控；
# 若需升级到 Log4j2 2.23.1，需同步替换 appender 与本文件的日志实现配置。
# =====================================================================

log4j.rootLogger=INFO, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
# 显式钉住编码，不依赖平台默认字符集；否则 Windows 下中文日志会乱码
log4j.appender.console.encoding=UTF-8
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%p] %c{1} - %m%n

# 只对 Mapper 包开 DEBUG：这样才看得到 SQL 的四类关键行
#   ==>  Preparing: ...   （最终 SQL）
#   ==> Parameters: ...   （绑定参数，含类型）
#   <==      Total: ...   （结果行数）
#   <==    Updates: ...   （影响行数）
log4j.logger.com.lab.mybatis.mapper=DEBUG
log4j.logger.com.lab.mapper=DEBUG
log4j.logger.com.lab.plus.mapper=DEBUG

# 框架自身噪音降级，避免日志被 MyBatis 内部输出淹没
log4j.logger.org.apache.ibatis=INFO
log4j.logger.org.mybatis=INFO
